<div class="max-w-sm p-6 space-y-4">
    <label for="email-input" class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">
        Alamat Email
    </label>

    <input 
        id="email-input"
        type="email" 
        placeholder="Masukkan email Anda..." 
        class="flex h-9 w-full rounded-md border border-slate-200 bg-white px-3 py-1 text-sm shadow-sm transition-all file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-slate-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500/50 focus-visible:border-blue-500 disabled:cursor-not-allowed disabled:opacity-50"
    />

    <div class="space-y-2">
        <label class="text-xs text-slate-500">Input Terkunci</label>
        <input 
            disabled
            type="text" 
            value="Tidak bisa diubah" 
            class="flex h-9 w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-1 text-sm opacity-50 cursor-not-allowed"
        />
    </div>
    
</div>
