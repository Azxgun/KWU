<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Alert Dialog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* CSS untuk simulasi Radix UI Dialog/Modal */
        .alert-dialog-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5); /* bg-black/50 */
            display: none; /* Disembunyikan secara default */
            align-items: center;
            justify-content: center;
            z-index: 50; /* z-50 */
            /* Simulasi fade-in-0 */
            transition: opacity 0.3s ease;
            opacity: 0; 
        }
        .alert-dialog-overlay.open {
            display: flex;
            opacity: 1; 
        }

        .alert-dialog-content {
            background: white;
            border-radius: 0.5rem; /* rounded-lg */
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
            width: 90%;
            max-width: 420px; /* max-w-lg atau sm:max-w-lg */
            /* Simulasi scale-95 to scale-100 */
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
            opacity: 0;
            margin: 1.5rem; /* Margin di mobile */
        }
        .alert-dialog-overlay.open .alert-dialog-content {
            transform: scale(1);
            opacity: 1;
        }

        /* Styling Tombol Primary (Simulasi buttonVariants default) */
        .btn-primary {
            background-color: #007bff; /* Warna biru primary */
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem; /* rounded-md */
            font-weight: 500; /* font-medium */
            transition: background-color 0.2s;
        }
        .btn-primary:hover {
            background-color: #0069d9;
        }
        
        /* Styling Tombol Outline (Simulasi buttonVariants outline) */
        .btn-outline {
            background-color: transparent;
            color: #4b5563; /* text-gray-600 */
            border: 1px solid #d1d5db; /* border-gray-300 */
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-outline:hover {
            background-color: #f3f4f6;
            color: #1f2937;
        }
    </style>
</head>
<body class="min-h-screen bg-gray-100 p-8">

    <div class="text-center">
        <button
            id="open-dialog-btn"
            type="button"
            class="btn-primary"
            data-slot="alert-dialog-trigger"
        >
            Hapus Akun Saya
        </button>
    </div>

    <div id="alert-dialog-overlay" class="alert-dialog-overlay" data-slot="alert-dialog-overlay">
        
        <div class="alert-dialog-content" role="alertdialog" aria-modal="true" aria-labelledby="dialog-title-id" aria-describedby="dialog-description-id">
            
            <div 
                data-slot="alert-dialog-header"
                class="flex flex-col space-y-2 p-6"
            >
                <h3 
                    id="dialog-title-id"
                    data-slot="alert-dialog-title"
                    class="text-lg font-semibold text-gray-900"
                >
                    Apakah Anda Yakin?
                </h3>
                
                <p 
                    id="dialog-description-id"
                    data-slot="alert-dialog-description"
                    class="text-sm text-gray-500"
                >
                    Tindakan ini tidak dapat dibatalkan. Ini akan menghapus akun Anda secara permanen dan menghapus data Anda dari server kami.
                </p>
            </div>

            <div 
                data-slot="alert-dialog-footer"
                class="flex flex-col-reverse gap-2 p-6 pt-0 sm:flex-row sm:justify-end"
            >
                <button
                    id="cancel-dialog-btn"
                    type="button"
                    class="btn-outline"
                    data-slot="alert-dialog-cancel"
                >
                    Batal
                </button>
                
                <button
                    id="action-dialog-btn"
                    type="button"
                    class="btn-primary bg-red-600 hover:bg-red-700"
                    data-slot="alert-dialog-action"
                >
                    Lanjutkan Hapus
                </button>
            </div>
        </div>
    </div>


    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const openBtn = document.getElementById('open-dialog-btn');
            const cancelBtn = document.getElementById('cancel-dialog-btn');
            const actionBtn = document.getElementById('action-dialog-btn');
            const overlay = document.getElementById('alert-dialog-overlay');
            const content = overlay.querySelector('.alert-dialog-content');

            function openDialog() {
                // Tampilkan overlay dan tambahkan kelas open untuk transisi
                overlay.style.display = 'flex';
                // Gunakan timeout kecil agar transisi CSS bisa bekerja
                setTimeout(() => {
                    overlay.classList.add('open');
                }, 10);
            }

            function closeDialog() {
                // Hapus kelas open untuk transisi penutupan
                overlay.classList.remove('open');
                // Sembunyikan setelah transisi selesai (300ms)
                setTimeout(() => {
                    overlay.style.display = 'none';
                }, 300);
            }

            // --- Event Listeners ---
            
            // 1. Trigger untuk membuka
            openBtn.addEventListener('click', openDialog);

            // 2. Tombol Cancel untuk menutup
            cancelBtn.addEventListener('click', closeDialog);

            // 3. Tombol Action (Simulasi tindakan)
            actionBtn.addEventListener('click', () => {
                alert('SUCCESS: Tindakan Hapus Akun Dilanjutkan!');
                closeDialog();
            });

            // 4. Klik di luar konten (Overlay) untuk menutup
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) {
                    closeDialog();
                }
            });
            
            // 5. Escape key untuk menutup
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && overlay.classList.contains('open')) {
                    closeDialog();
                }
            });
        });
    </script>
</body>
</html>
