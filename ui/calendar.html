<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Calendar Component</title>
</head>
<body class="p-10 bg-slate-50 flex justify-center">

    <div class="p-3 bg-white border border-slate-200 rounded-lg shadow-sm w-fit">
        <div class="flex flex-col gap-4">
            
            <div class="flex justify-center pt-1 relative items-center w-full">
                <span class="text-sm font-medium">February 2026</span>
                
                <div class="flex items-center gap-1">
                    <button class="absolute left-1 inline-flex items-center justify-center rounded-md border border-slate-200 bg-transparent hover:bg-slate-100 size-7 p-0 opacity-50 hover:opacity-100 transition-opacity">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                    </button>
                    <button class="absolute right-1 inline-flex items-center justify-center rounded-md border border-slate-200 bg-transparent hover:bg-slate-100 size-7 p-0 opacity-50 hover:opacity-100 transition-opacity">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6" transform="rotate(180 12 12)"/></svg>
                    </button>
                </div>
            </div>

            <table class="w-full border-collapse space-y-1">
                <thead>
                    <tr class="flex">
                        <th class="text-slate-500 rounded-md w-8 font-normal text-[0.8rem]">Su</th>
                        <th class="text-slate-500 rounded-md w-8 font-normal text-[0.8rem]">Mo</th>
                        <th class="text-slate-500 rounded-md w-8 font-normal text-[0.8rem]">Tu</th>
                        <th class="text-slate-500 rounded-md w-8 font-normal text-[0.8rem]">We</th>
                        <th class="text-slate-500 rounded-md w-8 font-normal text-[0.8rem]">Th</th>
                        <th class="text-slate-500 rounded-md w-8 font-normal text-[0.8rem]">Fr</th>
                        <th class="text-slate-500 rounded-md w-8 font-normal text-[0.8rem]">Sa</th>
                    </tr>
                </thead>
                <tbody class="block mt-2">
                    <tr class="flex w-full mt-2">
                        <td class="relative p-0 text-center text-sm w-8 text-slate-400 opacity-50">26</td>
                        <td class="relative p-0 text-center text-sm w-8 text-slate-400 opacity-50">27</td>
                        <td class="relative p-0 text-center text-sm w-8 text-slate-400 opacity-50">28</td>
                        <td class="relative p-0 text-center text-sm w-8 hover:bg-slate-100 rounded-md cursor-pointer transition-colors">1</td>
                        <td class="relative p-0 text-center text-sm w-8 hover:bg-slate-100 rounded-md cursor-pointer transition-colors">2</td>
                        <td class="relative p-0 text-center text-sm w-8 hover:bg-slate-100 rounded-md cursor-pointer transition-colors text-slate-900 font-semibold">3</td>
                        <td class="relative p-0 text-center text-sm w-8 hover:bg-slate-100 rounded-md cursor-pointer transition-colors">4</td>
                    </tr>
                    <tr class="flex w-full mt-2">
                        <td class="relative p-0 text-center text-sm w-8 hover:bg-slate-100 rounded-md cursor-pointer transition-colors">5</td>
                        <td class="relative p-0 text-center text-sm w-8 hover:bg-slate-100 rounded-md cursor-pointer transition-colors">6</td>
                        <td class="relative p-0 text-center text-sm w-8 hover:bg-slate-100 rounded-md cursor-pointer transition-colors">7</td>
                        <td class="relative p-0 text-center text-sm w-8 hover:bg-slate-100 rounded-md cursor-pointer transition-colors">8</td>
                        <td class="relative p-0 text-center text-sm w-8 bg-slate-900 text-white rounded-md cursor-pointer">9</td>
                        <td class="relative p-0 text-center text-sm w-8 hover:bg-slate-100 rounded-md cursor-pointer transition-colors">10</td>
                        <td class="relative p-0 text-center text-sm w-8 hover:bg-slate-100 rounded-md cursor-pointer transition-colors">11</td>
                    </tr>
                    <tr class="flex w-full mt-2">
                        <td class="relative p-0 text-center text-sm w-8 bg-slate-100 text-slate-900 rounded-md cursor-pointer font-bold">12</td>
                        <td class="relative p-0 text-center text-sm w-8 hover:bg-slate-100 rounded-md cursor-pointer transition-colors">13</td>
                        <td class="relative p-0 text-center text-sm w-8 hover:bg-slate-100 rounded-md cursor-pointer transition-colors">14</td>
                        <td class="relative p-0 text-center text-sm w-8 hover:bg-slate-100 rounded-md cursor-pointer transition-colors">15</td>
                        <td class="relative p-0 text-center text-sm w-8 hover:bg-slate-100 rounded-md cursor-pointer transition-colors">16</td>
                        <td class="relative p-0 text-center text-sm w-8 hover:bg-slate-100 rounded-md cursor-pointer transition-colors">17</td>
                        <td class="relative p-0 text-center text-sm w-8 hover:bg-slate-100 rounded-md cursor-pointer transition-colors">18</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
