<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Avatar Component</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* CSS Tambahan untuk Simulasi Radix UI Avatar */
        
        /* Base Avatar (Root) Style - relative flex size-10 shrink-0 overflow-hidden rounded-full */
        .avatar-root {
            position: relative;
            display: flex;
            flex-shrink: 0;
            overflow: hidden;
            border-radius: 9999px; /* rounded-full */
        }

        /* Avatar Image Style - aspect-square size-full */
        .avatar-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            aspect-ratio: 1 / 1;
        }

        /* Avatar Fallback Style - bg-muted flex size-full items-center justify-center rounded-full */
        .avatar-fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 9999px; /* rounded-full */
            background-color: #f3f4f6; /* bg-gray-100 (simulasi bg-muted) */
            color: #6b7280; /* text-gray-500 */
            font-size: 0.875rem; /* text-sm */
            font-weight: 500;
        }

        /* Varian Ukuran */
        .size-10 { width: 2.5rem; height: 2.5rem; } /* 40px */
        .size-14 { width: 3.5rem; height: 3.5rem; } /* 56px */
        .size-20 { width: 5rem; height: 5rem; } /* 80px */
    </style>
</head>
<body class="min-h-screen bg-gray-50 p-8">

    <div class="max-w-4xl mx-auto space-y-8">
        <h2 class="text-2xl font-bold text-gray-900 mb-6">
            Contoh Komponen Avatar (Image & Fallback)
        </h2>
        
        <div class="space-y-3">
            <h3 class="text-xl font-semibold">Avatar Image (Tersedia)</h3>
            <div class="flex items-center gap-4">
                
                <div data-slot="avatar" class="avatar-root size-20 shadow-md">
                    <img 
                        data-slot="avatar-image"
                        src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?fit=crop&w=80&h=80&q=80" 
                        alt="Foto Profil Pengguna" 
                        class="avatar-image"
                    />
                </div>

                <div data-slot="avatar" class="avatar-root size-10 shadow-sm">
                    <img 
                        data-slot="avatar-image"
                        src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?fit=crop&w=40&h=40&q=80" 
                        alt="Foto Profil Pengguna" 
                        class="avatar-image"
                    />
                </div>
                
            </div>
        </div>

        <div class="h-px bg-gray-200"></div>

        <div class="space-y-3">
            <h3 class="text-xl font-semibold">Avatar Fallback (Gambar Gagal Dimuat)</h3>
            <p class="text-gray-600 text-sm">Menggunakan inisial nama 'AD' (Admin Dashboard).</p>
            <div class="flex items-center gap-4">
                
                <div data-slot="avatar" class="avatar-root size-14 border border-gray-300">
                    <img 
                        data-slot="avatar-image"
                        src="gagal-load-url.png" 
                        alt="Foto Profil Gagal" 
                        class="avatar-image hidden"
                        onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                    />
                    <div data-slot="avatar-fallback" class="avatar-fallback">
                        AD
                    </div>
                </div>

                <div data-slot="avatar" class="avatar-root size-10 border border-gray-300">
                    <div data-slot="avatar-fallback" class="avatar-fallback text-xs">
                        U
                    </div>
                </div>
                
            </div>
        </div>

        <div class="h-px bg-gray-200"></div>

        <div class="space-y-3">
            <h3 class="text-xl font-semibold">Fallback Kustom</h3>
            <div data-slot="avatar" class="avatar-root size-14 border border-blue-500 shadow-lg">
                <div class="avatar-fallback bg-blue-500 text-white text-lg">
                    ABS
                </div>
            </div>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const avatarRoots = document.querySelectorAll('.avatar-root');
            
            avatarRoots.forEach(root => {
                const img = root.querySelector('.avatar-image');
                const fallback = root.querySelector('.avatar-fallback');

                if (img) {
                    img.onerror = () => {
                        // Jika gambar gagal dimuat, tampilkan fallback
                        img.style.display = 'none';
                        if (fallback) {
                            fallback.style.display = 'flex';
                        }
                    };
                    
                    // Cek apakah gambar sudah ada di cache (browser kadang tidak memicu onerror)
                    if (!img.complete || img.naturalHeight === 0) {
                         if (fallback) {
                            fallback.style.display = 'flex';
                        }
                    } else if (img.complete && img.naturalHeight > 0) {
                        // Jika gambar berhasil dimuat, pastikan fallback tersembunyi
                        if (fallback) {
                            fallback.style.display = 'none';
                        }
                    }
                }
            });
        });
    </script>
</body>
</html>
