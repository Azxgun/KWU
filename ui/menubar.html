<div class="p-8 bg-slate-50 min-h-[200px]">
  <div class="flex h-9 items-center gap-1 rounded-md border border-slate-200 bg-white p-1 shadow-sm w-fit">
    
    <div class="relative group">
      <button class="flex cursor-default select-none items-center rounded-sm px-3 py-1 text-sm font-medium outline-none hover:bg-slate-100 focus:bg-slate-100 data-[state=open]:bg-slate-100">
        File
      </button>
      <div class="hidden group-hover:block absolute left-0 top-full z-50 mt-1 min-w-[12rem] overflow-hidden rounded-md border border-slate-200 bg-white p-1 shadow-md animate-in fade-in zoom-in-95">
        <div class="px-2 py-1.5 text-sm hover:bg-slate-100 rounded-sm cursor-default flex justify-between">
          New Tab <span class="text-xs opacity-50 ml-auto">⌘T</span>
        </div>
        <div class="px-2 py-1.5 text-sm hover:bg-slate-100 rounded-sm cursor-default flex justify-between">
          New Window <span class="text-xs opacity-50 ml-auto">⌘N</span>
        </div>
        <div class="h-px bg-slate-100 my-1"></div>
        <div class="px-2 py-1.5 text-sm hover:bg-slate-100 rounded-sm cursor-default">Share</div>
        <div class="h-px bg-slate-100 my-1"></div>
        <div class="px-2 py-1.5 text-sm hover:bg-slate-100 rounded-sm cursor-default">Print...</div>
      </div>
    </div>

    <div class="relative group">
      <button class="flex cursor-default select-none items-center rounded-sm px-3 py-1 text-sm font-medium outline-none hover:bg-slate-100 focus:bg-slate-100">
        Edit
      </button>
    </div>

    <div class="relative group">
      <button class="flex cursor-default select-none items-center rounded-sm px-3 py-1 text-sm font-medium outline-none hover:bg-slate-100 focus:bg-slate-100">
        View
      </button>
    </div>

  </div>
</div>
