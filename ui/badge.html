<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badge Components</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-10 bg-white flex flex-col gap-4">

    <h2 class="text-lg font-bold mb-2">Koleksi Badge (Konversi dari TSX):</h2>

    <span class="inline-flex items-center justify-center rounded-md border px-2 py-0.5 text-xs font-medium w-fit whitespace-nowrap shrink-0 gap-1 overflow-hidden transition-[color,box-shadow] border-transparent bg-slate-900 text-slate-50 hover:bg-slate-900/90">
        Default Badge
    </span>

    <span class="inline-flex items-center justify-center rounded-md border px-2 py-0.5 text-xs font-medium w-fit whitespace-nowrap shrink-0 gap-1 overflow-hidden transition-[color,box-shadow] border-transparent bg-slate-100 text-slate-900 hover:bg-slate-100/80">
        Secondary Badge
    </span>

    <span class="inline-flex items-center justify-center rounded-md border border-slate-200 px-2 py-0.5 text-xs font-medium w-fit whitespace-nowrap shrink-0 gap-1 overflow-hidden transition-[color,box-shadow] text-slate-950 hover:bg-slate-100">
        Outline Badge
    </span>

    <span class="inline-flex items-center justify-center rounded-md border px-2 py-0.5 text-xs font-medium w-fit whitespace-nowrap shrink-0 gap-1 overflow-hidden transition-[color,box-shadow] border-transparent bg-red-600 text-white hover:bg-red-600/90">
        Destructive Badge
    </span>

</body>
</html>
