<div class="sheet-container">
  <label for="sheet-toggle" class="btn-trigger">Open Drawer</label>

  <input type="checkbox" id="sheet-toggle" class="sheet-checkbox" />

  <label for="sheet-toggle" class="sheet-overlay"></label>

  <div class="sheet-content">
    <div class="sheet-header">
      <h2 class="sheet-title">Edit Profile</h2>
      <p class="sheet-description">
        Make changes to your profile here. Click save when you're done.
      </p>
      <label for="sheet-toggle" class="sheet-close">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </label>
    </div>

    <div class="sheet-body">
      <div class="form-group">
        <label>Name</label>
        <input type="text" placeholder="Enter name">
      </div>
    </div>

    <div class="sheet-footer">
      <label for="sheet-toggle" class="btn-save">Save changes</label>
    </div>
  </div>
</div>
