<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Alert Component</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* CSS Tambahan untuk Simulasi Grid dan Icon Positioning */
        /* Class gabungan untuk meniru cva base styles */
        .alert-base {
            position: relative;
            width: 100%;
            border-radius: 0.5rem; /* rounded-lg */
            padding: 0.75rem 1rem; /* px-4 py-3 */
            font-size: 0.875rem; /* text-sm */
            
            /* Simulasi grid has-[>svg]:grid-cols-[calc(var(--spacing)*4)_1fr] */
            display: grid;
            grid-template-columns: 20px 1fr; /* Untuk icon 4x4 + gap, kira-kira 20px */
            gap-x: 0.75rem; /* gap-x-3 */
            gap-y: 2px; /* gap-y-0.5 */
            align-items: flex-start; /* items-start */
        }

        /* Styling Icon */
        .alert-base svg {
            width: 1rem; /* size-4 */
            height: 1rem; /* size-4 */
            transform: translateY(2px); /* translate-y-0.5 */
            color: currentColor;
            grid-column: 1 / 2; /* Ikon di kolom pertama */
        }
        
        /* Styling Title */
        .alert-title {
            grid-column: 2 / 3; /* Title di kolom kedua */
            line-clamp: 1;
            min-height: 1rem; /* min-h-4 */
            font-weight: 500; /* font-medium */
            letter-spacing: -0.025em; /* tracking-tight */
        }

        /* Styling Description */
        .alert-description {
            grid-column: 2 / 3; /* Description di kolom kedua */
        }

        /* --- Varian Styles (Meniru CVA) --- */
        
        /* Varian Default */
        .alert-default {
            background-color: white; /* bg-card (as white) */
            color: #1f2937; /* text-card-foreground (as gray-800) */
            border-color: #e5e7eb; /* border-gray-200 */
        }

        /* Varian Destructive (Error/Bahaya) */
        .alert-destructive {
            color: #dc2626; /* text-destructive (red-600) */
            background-color: white; /* bg-card (as white) */
            border-color: #fca5a5; /* border-red-300 */
        }
        /* Style deskripsi khusus untuk destructive */
        .alert-destructive .alert-description {
            color: rgba(220, 38, 38, 0.9); /* text-destructive/90 */
        }

    </style>
</head>
<body class="min-h-screen bg-gray-50 p-8">

    <div class="max-w-md mx-auto space-y-4">
        <h2 class="text-xl font-semibold mb-3">Contoh Komponen Alert</h2>
        
        <div 
            data-slot="alert"
            role="alert"
            class="alert-base alert-default border border-gray-200"
        >
            <svg class="text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            
            <div data-slot="alert-title" class="alert-title">
                Informasi Penting
            </div>
            
            <div data-slot="alert-description" class="alert-description">
                Perubahan data telah berhasil disimpan pada sistem kami.
            </div>
        </div>


        <div 
            data-slot="alert"
            role="alert"
            class="alert-base alert-destructive border border-red-300"
        >
            <svg class="text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            
            <div data-slot="alert-title" class="alert-title">
                Terjadi Kesalahan!
            </div>
            
            <div data-slot="alert-description" class="alert-description">
                Gagal memproses permintaan Anda. Mohon cek kembali koneksi internet dan coba lagi.
            </div>
        </div>

        
        <div 
            data-slot="alert"
            role="alert"
            class="alert-base alert-default border border-gray-200"
        >
            <svg class="text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            
            <div data-slot="alert-title" class="alert-title">
                Berhasil Diupdate
            </div>
            
        </div>
    </div>
</body>
</html>
