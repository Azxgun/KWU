<div class="toggle-group" data-variant="outline">
  <div class="toggle-item-wrapper">
    <input type="checkbox" id="bold" class="toggle-input">
    <label for="bold" class="toggle-button">
      <span class="icon">B</span>
    </label>
  </div>

  <div class="toggle-item-wrapper">
    <input type="checkbox" id="italic" class="toggle-input">
    <label for="italic" class="toggle-button">
      <span class="icon">I</span>
    </label>
  </div>

  <div class="toggle-item-wrapper">
    <input type="checkbox" id="underline" class="toggle-input">
    <label for="underline" class="toggle-button">
      <span class="icon">U</span>
    </label>
  </div>
</div>
