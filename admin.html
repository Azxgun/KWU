<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - Projek ABS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      .card-shadow {
        box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1),
          0 1px 2px 0 rgba(0, 0, 0, 0.06);
      }
      .bg-gradient-blue {
        background: linear-gradient(135deg, #007bff 0%, #00c6ff 100%);
      }
    </style>
  </head>
  <body class="min-h-screen bg-gray-50">
    <aside
      class="w-64 bg-gradient-to-b from-blue-600 to-cyan-400 text-white hidden lg:block fixed h-full shadow-lg z-20"
    >
      <div class="p-6">
        <h2 class="text-white text-2xl font-bold mb-8">ABS Admin</h2>
        <nav class="space-y-2">
          <a
            href="admin.html"
            class="block w-full px-4 py-3 bg-white/20 rounded-lg font-semibold text-white flex items-center gap-3"
          >
            <span>📊</span> Dashboard
          </a>

          <a
            href="servicemanagement.html"
            class="block w-full px-4 py-3 text-white/70 hover:bg-white/10 rounded-lg transition hover:text-white flex items-center gap-3"
          >
            <span>🛠</span> Services
          </a>

          <a
            href="usermanagement.html"
            class="block w-full px-4 py-3 text-white/70 hover:bg-white/10 rounded-lg transition hover:text-white flex items-center gap-3"
          >
            <span>👥</span> Users
          </a>

          <a
            href="Analytics.html"
            class="block w-full px-4 py-3 text-white/70 hover:bg-white/10 rounded-lg transition hover:text-white flex items-center gap-3"
          >
            <span>📈</span> Analytics
          </a>

          <a
            href="settingspage.html"
            class="block w-full px-4 py-3 text-white/70 hover:bg-white/10 rounded-lg transition hover:text-white flex items-center gap-3"
          >
            <span>⚙️</span> Settings
          </a>
        </nav>
        <div class="mt-10 pt-8 border-t border-white/20">
          <button
            id="logout-btn"
            class="flex w-full px-4 py-3 text-white/70 hover:bg-white/10 rounded-lg transition items-center gap-3"
          >
            <span>🚪</span> Logout
          </button>
        </div>
      </div>
    </aside>

    <main class="flex-1 lg:ml-64">
      <header class="bg-white shadow-sm sticky top-0 z-10 border-b">
        <div class="flex items-center justify-between px-8 py-4">
          <div class="flex items-center gap-3">
            <div
              class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-600 to-cyan-400 flex items-center justify-center text-white font-bold"
            >
              A
            </div>
            <div>
              <h1 class="text-xl font-semibold">Projek ABS</h1>
              <p class="text-xs text-gray-500">Admin Dashboard</p>
            </div>
          </div>
          <button class="lg:hidden text-gray-500">☰</button>
        </div>
      </header>

      <div class="p-4 sm:p-6 lg:p-8">
        <div class="flex justify-between items-center mb-8">
          <h1 class="text-3xl font-bold text-gray-900">Dashboard Overview</h1>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
          <div
            class="bg-white rounded-xl card-shadow p-6 border-l-4 border-blue-500"
          >
            <div class="flex justify-between items-start">
              <div>
                <p class="text-gray-500 text-sm font-medium uppercase">
                  Total Users
                </p>
                <h2
                  id="count-users"
                  class="text-3xl font-bold text-gray-800 mt-2"
                >
                  ...
                </h2>
              </div>
              <div class="p-3 bg-blue-50 text-blue-600 rounded-lg">👥</div>
            </div>
            <p class="text-xs text-gray-400 mt-4">Terdaftar di database</p>
          </div>

          <div
            class="bg-white rounded-xl card-shadow p-6 border-l-4 border-yellow-500"
          >
            <div class="flex justify-between items-start">
              <div>
                <p class="text-gray-500 text-sm font-medium uppercase">
                  Active Orders
                </p>
                <h2
                  id="count-orders"
                  class="text-3xl font-bold text-gray-800 mt-2"
                >
                  ...
                </h2>
              </div>
              <div class="p-3 bg-yellow-50 text-yellow-600 rounded-lg">🛠</div>
            </div>
            <p class="text-xs text-gray-400 mt-4">
              Pesanan dalam proses / pending
            </p>
          </div>

          <div
            class="bg-white rounded-xl card-shadow p-6 border-l-4 border-green-500"
          >
            <div class="flex justify-between items-start">
              <div>
                <p class="text-gray-500 text-sm font-medium uppercase">
                  Est. Revenue
                </p>
                <h2
                  id="count-revenue"
                  class="text-3xl font-bold text-gray-800 mt-2"
                >
                  ...
                </h2>
              </div>
              <div class="p-3 bg-green-50 text-green-600 rounded-lg">💰</div>
            </div>
            <p class="text-xs text-gray-400 mt-4">Dari pesanan selesai</p>
          </div>
        </div>

        <div class="bg-white rounded-xl card-shadow p-6 mb-8">
          <h3 class="text-lg font-bold text-gray-800 mb-6">
            Service Analytics
          </h3>
          <div class="h-80 w-full relative">
            <canvas id="serviceChart"></canvas>
          </div>
        </div>
      </div>
    </main>

    <script type="module">
      import {
        auth,
        db,
        onAuthStateChanged,
        signOut,
        getDoc,
        doc,
        collection,
        getDocs,
      } from "./firebase-config.js";

      // 1. CEK AUTH & ROLE ADMIN
      onAuthStateChanged(auth, async (user) => {
        if (!user) {
          window.location.href = "login.html";
        } else {
          try {
            const userDoc = await getDoc(doc(db, "users", user.uid));
            if (userDoc.exists() && userDoc.data().role === "admin") {
              loadDashboardData();
            } else {
              alert("Akses Ditolak! Anda bukan Admin.");
              window.location.href = "index.html";
            }
          } catch (e) {
            console.error("Auth check error", e);
          }
        }
      });

      // 2. LOGOUT
      document
        .getElementById("logout-btn")
        .addEventListener("click", async () => {
          await signOut(auth);
          window.location.href = "login.html";
        });

      // 3. FETCH DATA & RENDER CHART
      async function loadDashboardData() {
        try {
          // A. Users
          const usersSnap = await getDocs(collection(db, "users"));
          document.getElementById("count-users").innerText = usersSnap.size;

          // B. Orders
          const ordersSnap = await getDocs(collection(db, "orders"));

          let pending = 0;
          let progress = 0;
          let completed = 0;

          ordersSnap.forEach((doc) => {
            const status = doc.data().status;
            if (status === "Completed") completed++;
            else if (status === "In Progress") progress++;
            else pending++;
          });

          // Update Text UI
          document.getElementById("count-orders").innerText =
            pending + progress;

          // Hitung Revenue (Asumsi: Rp 150.000 per service selesai)
          const revenue = completed * 150000;
          document.getElementById("count-revenue").innerText =
            "Rp " + revenue.toLocaleString("id-ID");

          // C. Render Chart
          renderChart(pending, progress, completed);
        } catch (error) {
          console.error("Error loading dashboard:", error);
        }
      }

      function renderChart(pending, progress, completed) {
        const ctx = document.getElementById("serviceChart").getContext("2d");
        new Chart(ctx, {
          type: "bar", // Bisa ganti 'doughnut' atau 'line'
          data: {
            labels: ["Pending", "In Progress", "Completed"],
            datasets: [
              {
                label: "Jumlah Pesanan",
                data: [pending, progress, completed],
                backgroundColor: [
                  "#fbbf24", // Yellow
                  "#3b82f6", // Blue
                  "#22c55e", // Green
                ],
                borderRadius: 5,
                borderWidth: 0,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: { beginAtZero: true, ticks: { precision: 0 } },
            },
          },
        });
      }
    </script>
  </body>
</html>
