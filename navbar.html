<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Navbar Component</title>
</head>
<body class="bg-slate-50">

    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                
                <div class="flex items-center gap-2 cursor-pointer">
                    <div class="flex items-center gap-2">
                        <img src="https://via.placeholder.com/32" alt="Logo" class="h-8 w-auto">
                        <span class="text-xl font-bold bg-gradient-to-r from-[#007bff] to-[#00c6ff] bg-clip-text text-transparent">
                            JasaServis
                        </span>
                    </div>
                </div>

                <div class="hidden md:flex items-center gap-8">
                    <a href="#home" class="text-sm font-medium text-[#007bff] transition-colors border-b-2 border-[#007bff] pb-1">
                        Home
                    </a>
                    <a href="#service" class="text-sm font-medium text-slate-600 hover:text-[#007bff] transition-colors">
                        Service
                    </a>
                    <a href="#admin" class="text-sm font-medium text-slate-600 hover:text-[#007bff] transition-colors">
                        Admin
                    </a>
                </div>

                <div class="hidden md:flex items-center gap-4">
                    <button class="rounded-full px-6 py-2 text-sm font-semibold text-white transition-all hover:opacity-90 active:scale-95" 
                            style="background: linear-gradient(135deg, #007bff 0%, #00c6ff 100%);">
                        Login
                    </button>
                </div>

                <div class="md:hidden flex items-center">
                    <button class="inline-flex items-center justify-center p-2 rounded-md text-slate-600 hover:bg-slate-100 outline-none">
                        <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
                        </svg>
                    </button>
                </div>

            </div>
        </div>

        <div class="md:hidden border-t border-slate-100 bg-white">
            <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
                <a href="#" class="block px-3 py-2 rounded-md text-base font-medium text-[#007bff] bg-blue-50">Home</a>
                <a href="#" class="block px-3 py-2 rounded-md text-base font-medium text-slate-600 hover:bg-slate-50">Service</a>
                <a href="#" class="block px-3 py-2 rounded-md text-base font-medium text-slate-600 hover:bg-slate-50">Admin</a>
                <div class="pt-4 pb-2 border-t border-slate-100">
                    <button class="w-full text-center py-2 rounded-full text-white font-semibold" 
                            style="background: linear-gradient(135deg, #007bff 0%, #00c6ff 100%);">
                        Login
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="h-[200vh] p-10">
        <p class="text-slate-400">Scroll ke bawah untuk melihat efek sticky navbar...</p>
    </div>

</body>
</html>
